<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .orb-pulse {
      animation: pulse 8s ease-in-out infinite alternate;
    }
    .orb-pulse-rev {
      animation: pulse-rev 10s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8, 12;
      animation: dash 20s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6, 10;
      animation: dash-rev 15s linear infinite;
    }
    .float-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    .float-card-slow {
      animation: float 8s ease-in-out infinite alternate-reverse;
    }
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes pulse-rev {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-30px, 20px); opacity: 0.55; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -400; }
    }
    @keyframes dash-rev {
      to { stroke-dashoffset: 400; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .font-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
    }
    .font-sans {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience / Dynamic Backing Orbs (Under Grid & Text) -->
  <g filter="url(#glow)">
    <circle class="orb-pulse" cx="200" cy="90" r="120" fill="#6366f1" />
    <circle class="orb-pulse-rev" cx="1020" cy="180" r="140" fill="#ec4899" />
    <circle class="orb-pulse" cx="620" cy="340" r="110" fill="#06b6d4" />
  </g>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Tech Circuit / Stream Lines in Background -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 140 Q 300 80 600 200 T 1250 160" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="stream-line-rev" d="M -50 280 Q 350 360 700 240 T 1250 300" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <path class="stream-line" d="M 100 -20 Q 250 200 450 440" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <path class="stream-line-rev" d="M 1100 -20 Q 950 220 750 440" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Dynamic Floating Decorative Tech Badges / Pills (Positioned safely away from center title) -->
  <g class="float-card" opacity="0.85">
    <rect x="920" y="55" width="210" height="42" rx="21" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="942" cy="76" r="6" fill="#10b981" />
    <text x="960" y="81" fill="#e2e8f0" font-size="13" class="font-sans" font-weight="600">⚡ Serverless &amp; Cloud APIs</text>
  </g>

  <g class="float-card-slow" opacity="0.85">
    <rect x="70" y="65" width="195" height="42" rx="21" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="92" cy="86" r="6" fill="#06b6d4" />
    <text x="108" y="91" fill="#e2e8f0" font-size="13" class="font-sans" font-weight="600">🛡️ Self-Hosted Toolkits</text>
  </g>

  <g class="float-card" opacity="0.8">
    <rect x="940" y="325" width="190" height="38" rx="19" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="960" cy="344" r="5" fill="#ec4899" />
    <text x="975" y="349" fill="#e2e8f0" font-size="13" class="font-sans" font-weight="600">🚀 High-Volume OCR</text>
  </g>

  <g class="float-card-slow" opacity="0.8">
    <rect x="80" y="325" width="180" height="38" rx="19" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="100" cy="344" r="5" fill="#8b5cf6" />
    <text x="115" y="349" fill="#e2e8f0" font-size="13" class="font-sans" font-weight="600">📄 PDF Manipulation</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle & Ecosystem Pills - Never Obscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 115)">
    <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-size="12" class="font-sans" font-weight="700" letter-spacing="2">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Headline Title with Gradient -->
  <text x="600" y="195" text-anchor="middle" class="font-title" font-size="50" fill="url(#primary-grad)" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.85))">
    Cloud PDF Manipulation Services
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" class="font-sans" font-size="20" fill="#cbd5e1" font-weight="500" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
    Enterprise Document APIs • Serverless Processing • Self-Hosted Open-Source Engines
  </text>

  <!-- Micro Feature Badges in Foreground -->
  <g transform="translate(600, 285)">
    <text x="0" y="0" text-anchor="middle" class="font-sans" font-size="14" fill="#94a3b8" font-weight="500">
      Merge • Split • Convert • OCR • Compress • Watermark • Form Fill • E-Sign
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="425" y="315" width="350" height="3" rx="1.5" fill="url(#primary-grad)" />
</svg>
